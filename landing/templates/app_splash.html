{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b3c82">
    <title>District 1 Classroom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'accounts/css/app-splash.css' %}" rel="stylesheet">
    <noscript><meta http-equiv="refresh" content="1;url={{ login_url }}"></noscript>
</head>
<body>
    <main class="app-splash" aria-label="District 1 Classroom is loading">
        <div class="splash-brand">
            <span class="splash-seal">D1</span>
            <h1>District 1</h1>
            <p>Classroom</p>
        </div>

        <div class="splash-status" role="status" aria-live="polite">
            <span class="splash-loader" aria-hidden="true"></span>
            <span>Preparing your classroom…</span>
        </div>
    </main>

    <script>
        window.setTimeout(function () {
            window.location.replace("{{ login_url|escapejs }}");
        }, 1200);
    </script>
</body>
</html>
