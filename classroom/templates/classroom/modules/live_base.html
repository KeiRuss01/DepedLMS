{% extends "classroom/master.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet"
      href="{% static 'classroom/css/module_live.css' %}?v=20260917-2">
{% endblock %}

{% block content %}
<div class="module-live">

    <div class="mb-4">
        <a href="{% url 'classroom:class_page' classroom.class_id %}?tab=modules"
           class="d-inline-block mb-2 text-decoration-none">
            &larr; Back to class modules
        </a>
        <div class="small text-muted">
            {{ classroom.class_name }} &middot; Academic year {{ classroom.school_year }}
        </div>
    </div>

    {% block module_content %}{% endblock %}
</div>
{% endblock %}

{% block extra_js %}
<script type="module"
        src="{% static 'classroom/js/module_reader.js' %}?v=20260917-2"></script>
{% endblock %}
